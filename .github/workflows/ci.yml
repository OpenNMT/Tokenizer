name: CI

on:
  push:
    branches: [master]
    tags: [v*]
  pull_request:
    branches: [master]

jobs:
# ---------------------------------------------------------
# 1. C++ library sanity build (fast, no matrix explosion)
# ---------------------------------------------------------
  build-cpp:
    name: Build C++ library
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build C++ library
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON .
          make -j2
          test/onmt_tokenizer_test test/data

# ---------------------------------------------------------
# 2. Build Python wheels
# ---------------------------------------------------------
  build-wheels:
    name: Build wheels (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: amd64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'aarch64'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.0
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_SKIP: "pp* *-musllinux_*"

          CIBW_BEFORE_BUILD: pip install pybind11==2.10.1
          CIBW_TEST_COMMAND: pytest {project}/bindings/python/test/test.py
          CIBW_TEST_REQUIRES: pytest

          # Linux
          CIBW_ENVIRONMENT_LINUX: >
            TOKENIZER_ROOT=/project/build/install
            ICU_ROOT=/project/icu
          CIBW_BEFORE_ALL_LINUX: bindings/python/tools/prepare_build_environment_linux.sh
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014

          # macOS (arm64 only)
          CIBW_ENVIRONMENT_MACOS: TOKENIZER_ROOT=${GITHUB_WORKSPACE}/build/install
          CIBW_BEFORE_ALL_MACOS: bindings/python/tools/prepare_build_environment_macos.sh
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""

          # Windows
          CIBW_ENVIRONMENT_WINDOWS: TOKENIZER_ROOT=${GITHUB_WORKSPACE}/build/install
          CIBW_BEFORE_ALL_WINDOWS: bash bindings/python/tools/prepare_build_environment_windows.sh

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

# ---------------------------------------------------------
# 3. Publish to PyPI (tags only)
# ---------------------------------------------------------
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cpp, build-wheels]
    runs-on: ubuntu-latest

    permissions:
      id-token: write  # for Trusted Publishing

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect wheels
        run: |
          mkdir dist
          find artifacts -name "*.whl" -exec cp {} dist/ \;
          ls -lh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
